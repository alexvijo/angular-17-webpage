<section class="section banner" id="banner">
    <div [@bannerTrigger] class="container">
      <div class="section-box-banner">
        <div class="banner-layout">
          <div class="content">
            <div>
                <p class="banner-pretitle"><span class="n-section-title"></span> {{"Banner.Pretitle" | translate}}</p>
            </div>
            <div class='banner-title'>
                <h1 class="alex-vicente">Alex Vicente</h1>
                <h2 class="front-developer" [innerHTML]="'Banner.Role' | translate"></h2>
            </div>
            <div class='banner-description'>
                <p [innerHTML]='"Banner.Description" | translate' class="mt-1"></p>
            </div>
            <div class="pixel-side-mobile">
              <app-skills-folder></app-skills-folder>
            </div>
          </div>
          <div class="pixel-side">
            <app-skills-folder></app-skills-folder>
          </div>
        </div>
      </div>
    </div>
</section>
